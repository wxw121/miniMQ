<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">MiniMQ System Architecture</title>
<desc id="description">Five layers show a browser, CLI and Java application using the HTTP demo and SDK, a three-broker MiniMQ cluster, per-broker on-disk logs and a three-member etcd cluster. A numbered publish path runs from HTTP through controller discovery and the partition leader to WAL, segmented log and policy-driven disk flush. Solid arrows show request and response or local I/O, dashed arrows show asynchronous metadata watch events.</desc>
<defs>
