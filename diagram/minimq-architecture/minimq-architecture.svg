  <style>
    text { font-family: 'Segoe UI', Inter, Arial, sans-serif; fill: #172b45; }
    .headline { font-size: 49px; font-weight: 730; letter-spacing: -1.2px; }
    .subtitle { font-size: 19px; fill: #50637a; }
    .layer-name { font-size: 17px; font-weight: 750; letter-spacing: .55px; }
    .layer-sub { font-size: 15px; fill: #526780; }
    .name { font-size: 23px; font-weight: 700; letter-spacing: -.16px; }
    .name.compact { font-size: 20px; }
    .detail { font-size: 17px; fill: #3c516a; }
    .detail.emphasis { font-weight: 690; fill: #23578b; }
    .note { font-size: 16px; fill: #51667e; }
    .protocol { font-size: 17px; font-weight: 650; fill: #254e77; }
    .link-label { font-size: 14px; font-weight: 650; fill: #445f7d; }
    .async-label { fill: #714c92; }
    .section-name { font-size: 19px; font-weight: 730; }
    .band { stroke: #dce4ee; stroke-width: 1; }
    .band.business { fill: #f3f7fc; } .rail.business { fill: #e0ebf8; }
    .band.application { fill: #f0f8fa; } .rail.application { fill: #dceff2; }
    .band.middleware { fill: #fff9f1; } .rail.middleware { fill: #faecd9; }
    .band.data { fill: #f8f5fc; } .rail.data { fill: #ece4f6; }
    .band.infrastructure { fill: #f2f5f8; } .rail.infrastructure { fill: #e3eaf1; }
    .card { fill: #fff; stroke: #acbdd1; stroke-width: 1.15; }
    .card.business { stroke: #a7bdda; } .card.application { stroke: #8fbac2; }
    .card.middleware { stroke: #ceb69a; } .card.data { stroke: #bcadd1; }
    .card.infrastructure { stroke: #a7b7c9; }
    .card.selected { stroke: #5b84b2; stroke-width: 1.55; fill: #f4f8fd; }
    .cluster { fill: #fffdf9; stroke: #c7a980; stroke-width: 1.15; stroke-dasharray: 5 4; }
    .icon { fill: none; stroke: #466b98; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    .icon.application { stroke: #357889; } .icon.middleware { stroke: #957044; }
    .icon.data { stroke: #796098; } .icon.infrastructure { stroke: #536b88; }
    .sync, .primary, .async { fill: none; stroke-linejoin: round; stroke-width: 1.7; }
    .sync { stroke: #526982; marker-end: url(#end); }
    .primary { stroke: #25609b; stroke-width: 2; marker-end: url(#end-primary); }
    .async { stroke: #8666a5; stroke-dasharray: 6 5; marker-end: url(#end-async); }
    .step { fill: #255786; } .step-text { fill: #fff; font-size: 14px; font-weight: 700; }
  </style>
</defs>
