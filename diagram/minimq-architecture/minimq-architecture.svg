    <path d="M0 0L10 5 0 10Z" fill="#526982"/>
  </marker>
  <marker id="end-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
